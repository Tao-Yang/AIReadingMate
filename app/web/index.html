<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>阅读伴侣 · PDF Reading Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      阅读伴侣 <small>Reading Companion</small>
    </div>
    <div class="controls">
      <label class="file-btn">
        打开 PDF
        <input type="file" id="file-input" accept="application/pdf" hidden />
      </label>
      <button id="prev-page" class="nav-btn" title="上一页">‹</button>
      <span id="page-indicator" class="page-indicator">— / —</span>
      <button id="next-page" class="nav-btn" title="下一页">›</button>
      <label class="zoom">
        缩放
        <input type="range" id="zoom-range" min="0.6" max="2.4" step="0.2" value="1.2" />
      </label>
    </div>
  </header>

  <div class="seal">划词即注 熊猫伴读</div>

  <main id="viewer" class="viewer">
    <div id="placeholder" class="placeholder">
      <div class="placeholder-card">
        <h1>阅读伴侣</h1>
        <p>👉 点击右上角 「打开 PDF」，哪里不会点哪里。<br />选中英文内容，小机器人秒变随身翻译官，中文解释马上到。</p>
      </div>
    </div>
  </main>

  <!-- 划词注释气泡 -->
  <div id="bubble" class="bubble hidden" role="status" aria-live="polite">
    <div class="bubble-arrow"></div>
    <div class="bubble-term" id="bubble-term"></div>
    <div class="bubble-body" id="bubble-body"></div>
    <div class="bubble-note" id="bubble-note"></div>
  </div>

  <!-- 真人伴读形象 -->
  <div id="robot-stage" class="robot-stage" title="你的阅读伴侣">
    <img id="robot-avatar" class="robot-avatar" src="avatar.jpg" alt="阅读伴侣" />
    <div id="robot-status" class="robot-status">Hi～划个词试试</div>
  </div>

  <!-- 依赖：PDF.js（渲染 + 文本层） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="robot.js"></script>
  <script src="app.js"></script>
</body>
</html>
