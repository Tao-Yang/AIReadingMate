<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 阅读伴侣 · 划词即得中文注释</title>
<meta name="description" content="打开英文 PDF，划选单词、词组或句子，熊猫机器人立刻给出符合语境的简明中文注释。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #24311d;
    --ink-soft: #33402c;
    --seal: #a5352f;
    --cream: #fbe7cf;
    --parchment-a: #efe9d6;
    --parchment-b: #ded6bb;
    --green: #2e6b45;
    --amber: #f2a52b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Noto Serif SC", serif;
    color: var(--ink-soft);
    /* 纯 CSS 宣纸底色：多层柔和渐变叠出米黄质感，无需外部图片。 */
    background:
      radial-gradient(1200px 820px at 18% 8%, rgba(255, 255, 255, 0.4), transparent 60%),
      radial-gradient(900px 700px at 88% 92%, rgba(180, 168, 132, 0.35), transparent 62%),
      linear-gradient(160deg, rgba(239, 233, 214, 0.92), rgba(222, 214, 187, 0.96)),
      var(--parchment-b);
    background-attachment: fixed;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    position: relative;
    width: min(92vw, 640px);
    background: rgba(255, 253, 246, 0.8);
    border: 1px solid rgba(120, 110, 80, 0.28);
    border-radius: 20px;
    padding: 44px 40px 38px;
    text-align: center;
    box-shadow: 0 18px 60px rgba(40, 60, 30, 0.28);
    backdrop-filter: blur(3px);
    overflow: hidden;
  }
  .stamp {
    position: absolute;
    top: 20px;
    right: 16px;
    writing-mode: vertical-rl;
    text-orientation: upright;
    background: var(--seal);
    color: var(--cream);
    font-family: "Ma Shan Zheng", "Noto Serif SC", serif;
    font-size: 15px;
    letter-spacing: 5px;
    padding: 12px 7px;
    border-radius: 6px;
    border: 2px solid rgba(251, 231, 207, 0.55);
    box-shadow: 0 4px 12px rgba(120, 30, 25, 0.35);
    transform: rotate(-2deg);
    line-height: 1.5;
    z-index: 3;
  }
  /* 熊猫机器人徽标 */
  .emblem { width: 118px; height: 118px; margin: 4px auto 10px; display: block; }
  h1 {
    font-family: "Ma Shan Zheng", "Noto Serif SC", cursive;
    font-size: clamp(32px, 6.6vw, 46px);
    line-height: 1.1;
    letter-spacing: 10px;
    margin: 2px 0 6px;
    color: var(--ink);
    font-weight: 400;
    text-shadow: 0 2px 0 rgba(255, 255, 255, 0.5), 0 8px 22px rgba(40, 60, 30, 0.28);
  }
  .subtitle {
    font-size: 16px;
    letter-spacing: 3px;
    color: var(--green);
    margin-bottom: 24px;
  }
  .desc {
    font-size: 15px;
    line-height: 1.9;
    color: #4a4536;
    margin: 0 auto 30px;
    max-width: 470px;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-width: 220px;
    padding: 14px 30px;
    font-family: "Noto Serif SC", serif;
    font-size: 17px;
    letter-spacing: 4px;
    color: var(--cream);
    background: var(--seal);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 6px 18px rgba(120, 30, 25, 0.32);
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(120, 30, 25, 0.4); }
  .cta:active { transform: translateY(0); }
  .cta[disabled] { opacity: 0.55; cursor: progress; transform: none; box-shadow: 0 6px 18px rgba(120, 30, 25, 0.2); }
  .status {
    margin-top: 20px;
    font-size: 13px;
    letter-spacing: 1px;
    color: #7a7259;
    min-height: 20px;
  }
  .dot {
    display: inline-block;
    width: 8px; height: 8px;
    margin-right: 6px;
    border-radius: 50%;
    background: #c9b98f;
    vertical-align: middle;
    transition: background 0.3s ease;
  }
  .dot.warming { background: #d8a24a; animation: pulse 1.1s ease-in-out infinite; }
  .dot.ready { background: #3f9a5a; }
  @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
  .features {
    display: flex;
    justify-content: center;
    gap: 22px;
    flex-wrap: wrap;
    margin: 4px 0 26px;
    font-size: 13px;
    letter-spacing: 1px;
    color: #6b6552;
  }
  .features span::before { content: "· "; color: var(--amber); }
  .foot { margin-top: 26px; font-size: 12px; color: #9a927c; letter-spacing: 1px; }
  .foot a { color: #7a7259; }

  .loader {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 40px;
    background: rgba(255, 253, 246, 0.94);
    backdrop-filter: blur(4px);
  }
  .loader[hidden] { display: none; }
  .loader-title {
    font-family: "Ma Shan Zheng", "Noto Serif SC", cursive;
    font-size: 28px;
    letter-spacing: 6px;
    color: var(--ink);
  }
  .bar {
    width: min(78%, 380px);
    height: 14px;
    background: rgba(120, 110, 80, 0.18);
    border-radius: 999px;
    overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(60, 50, 20, 0.18);
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--green), var(--seal));
    transition: width 0.28s ease;
  }
  .loader-pct { font-size: 15px; letter-spacing: 2px; color: var(--seal); font-variant-numeric: tabular-nums; }
  .loader-hint { font-size: 13px; letter-spacing: 1px; color: #7a7259; max-width: 360px; line-height: 1.7; }
</style>
</head>
<body>
  <main class="card">
    <div class="stamp">划词即注 熊猫伴读</div>

    <!-- 熊猫机器人徽标 -->
    <svg class="emblem" viewBox="0 0 120 120" role="img" aria-label="熊猫机器人">
      <ellipse cx="60" cy="112" rx="30" ry="5" fill="rgba(60,50,20,0.14)" />
      <circle cx="34" cy="30" r="13" fill="#1c1c1c" />
      <circle cx="86" cy="30" r="13" fill="#1c1c1c" />
      <circle cx="34" cy="30" r="6" fill="#4a4a4a" />
      <circle cx="86" cy="30" r="6" fill="#4a4a4a" />
      <circle cx="60" cy="46" r="34" fill="#f2a52b" />
      <ellipse cx="47" cy="44" rx="9" ry="12" fill="#1c1c1c" transform="rotate(-16 47 44)" />
      <ellipse cx="73" cy="44" rx="9" ry="12" fill="#1c1c1c" transform="rotate(16 73 44)" />
      <circle cx="47" cy="45" r="4.5" fill="#33baff" />
      <circle cx="73" cy="45" r="4.5" fill="#33baff" />
      <circle cx="45.5" cy="43.5" r="1.6" fill="#fff" />
      <circle cx="71.5" cy="43.5" r="1.6" fill="#fff" />
      <ellipse cx="60" cy="55" rx="4" ry="2.6" fill="#1c1c1c" />
      <path d="M54 60 Q60 65 66 60" stroke="#1c1c1c" stroke-width="2" fill="none" stroke-linecap="round" />
      <rect x="44" y="82" width="32" height="26" rx="12" fill="#f2a52b" />
      <circle cx="60" cy="95" r="6" fill="#33baff" />
    </svg>

    <h1>A I 阅 读 伴 侣</h1>
    <div class="subtitle">划词即注 · 熊猫伴读</div>
    <p class="desc">
      打开英文 PDF，划选任意单词、词组或句子，
      可爱的熊猫机器人会立刻给出符合语境的简明中文注释，
      注释就浮在选中处旁边，陪你轻松读完英文原著。
    </p>

    <div class="features">
      <span>离线词典（ECDICT + 历史文化词库）</span>
      <span>3D 熊猫机器人</span>
      <span>划词悬浮注释</span>
    </div>

    <button id="enter" class="cta" type="button">进 入 应 用</button>

    <div class="status" id="status" aria-live="polite">
      <span class="dot" id="dot"></span><span id="statusText">准备就绪</span>
    </div>

    <div class="foot">
      开源项目 · <a href="https://github.com/Tao-Yang/AIReadingMate" target="_blank" rel="noopener">GitHub</a>
      ｜ Every word has a story.
    </div>

    <!-- 进入应用后的启动进度浮层 -->
    <div class="loader" id="loader" hidden>
      <div class="loader-title">正在启动应用</div>
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      <div class="loader-pct" id="barPct">0%</div>
      <div class="loader-hint" id="loaderHint">正在唤醒云端服务器，就绪后会自动进入，请稍候…</div>
    </div>
  </main>

<script>
  // 把 APP_URL 改成你部署好的「阅读伴侣」后端地址（例如 Render / Hugging Face Space）。
  // 后端即本仓库 app/server/app.py 提供的服务；Netlify 只托管本落地页。
  // 免费云服务器可能冷启动（约 1 分钟），下方进度条会先预热再自动跳转。
  var APP_URL = "";

  var dot = document.getElementById("dot");
  var statusText = document.getElementById("statusText");
  var enter = document.getElementById("enter");
  var loader = document.getElementById("loader");
  var barFill = document.getElementById("barFill");
  var barPct = document.getElementById("barPct");
  var loaderHint = document.getElementById("loaderHint");

  function setStatus(state, text) {
    dot.className = "dot" + (state ? " " + state : "");
    statusText.textContent = text;
  }

  var okCount = 0, warmed = false, attempts = 0, MAX_ATTEMPTS = 80;

  function markReady() {
    warmed = true;
    setStatus("ready", "应用已就绪，点击上方按钮即可进入。");
  }

  function poll() {
    if (warmed || !APP_URL) return;
    attempts++;
    fetch(APP_URL, { mode: "no-cors", cache: "no-store" })
      .then(function () {
        okCount++;
        if (okCount >= 2) { markReady(); }
        else { setTimeout(poll, 2500); }
      })
      .catch(function () {
        okCount = 0;
        if (attempts < MAX_ATTEMPTS) { setTimeout(poll, 2500); }
      });
  }

  var progress = 0, progressTimer = null, startTime = 0, entering = false;

  function renderProgress() {
    var pct = Math.round(progress);
    barFill.style.width = pct + "%";
    barPct.textContent = pct + "%";
  }

  function tick() {
    var elapsed = (Date.now() - startTime) / 1000;
    if (warmed) {
      progress = Math.min(100, progress + 6);
      loaderHint.textContent = "服务器已就绪，正在进入应用…";
      renderProgress();
      if (progress >= 100) {
        clearInterval(progressTimer);
        setTimeout(function () { window.location.href = APP_URL; }, 250);
      }
      return;
    }
    var ceiling = 92 * (1 - Math.exp(-elapsed / 20));
    if (progress < ceiling) { progress = progress + (ceiling - progress) * 0.15; }
    renderProgress();
  }

  function beginEnter() {
    if (entering) return;
    if (!APP_URL) {
      setStatus("warming", "请先在 netlify/index.html 中把 APP_URL 设为你的应用地址。");
      return;
    }
    entering = true;
    enter.setAttribute("disabled", "disabled");
    loader.hidden = false;
    startTime = Date.now();
    progress = warmed ? 60 : 4;
    renderProgress();
    if (!warmed) { poll(); }
    progressTimer = setInterval(tick, 120);
  }

  enter.addEventListener("click", beginEnter);

  window.addEventListener("load", function () {
    if (APP_URL) {
      setStatus("warming", "正在为你唤醒应用…（约需 1 分钟）");
      setTimeout(poll, 200);
    } else {
      setStatus("", "在 netlify/index.html 中设置 APP_URL 后即可一键进入应用。");
    }
  });
</script>
</body>
</html>
